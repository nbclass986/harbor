name: Attach plugin files

on:
  release:
    types: [published]
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check distribution and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: node .github/scripts/verify-release.cjs
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: Harbor ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            main.js
            manifest.json
            styles.css
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            ## Harbor ${{ github.event.release.tag_name || github.ref_name }}

            - 首次启用时自动创建“闪念胶囊”项目，默认位置为 `Harbor/Harbor_PROJECT/闪念胶囊.md`，旧用户升级后也会补建一次。
            - 使用当前 YAML 类型映射与项目模板；已有同名笔记不覆盖、不重复创建，初始化后主动删除也不会自动重建。
            - 项目窗口中的属性入口统一称为“属性面板”，设置中的中文字段说明改用“笔记属性名”，更方便入门用户理解。

            Automatically create the 闪念胶囊 capture project on first initialization,
            using current YAML mappings and the project template. Existing notes are preserved;
            deleting the project after initialization does not cause it to be recreated.

            **安装 / Install:** BRAT 仓库地址 `nbclass986/harbor`，或将下面三个文件放入 `.obsidian/plugins/harbor/`。
            Use BRAT with `nbclass986/harbor`, or copy the three attached files into `.obsidian/plugins/harbor/`.

            Requires Obsidian 1.9.10+. BRAT install/update acceptance and physical mobile testing remain pending. Notion sync is unavailable in this version.
