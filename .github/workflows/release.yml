name: Attach plugin files

on:
  release:
    types: [published]
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check distribution and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: node .github/scripts/verify-release.cjs
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            main.js
            manifest.json
            styles.css
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            ## Harbor ${{ github.event.release.tag_name || github.ref_name }} — 免费公开试用 / Public trial

            - 项目窗口菜单移至关闭按钮前，移除占用空间的左侧栏。
            - 项目顶栏使用 24 种低饱和配色，同时打开时避免重色。
            - 项目浮窗可折叠为短标题条，展开恢复尺寸，不阻挡其他页面操作。
            - 中英文 README 新增项目停靠 GIF 步骤演示。

            Compact window menu, distinct muted project colors, title-sized collapsed bars,
            restored expanded dimensions, and a new docking walkthrough GIF.

            **安装 / Install:** BRAT 仓库地址 `nbclass986/harbor`，或将下面三个文件放入 `.obsidian/plugins/harbor/`。
            Use BRAT with `nbclass986/harbor`, or copy the three attached files into `.obsidian/plugins/harbor/`.

            Requires Obsidian 1.9.10+. Desktop tested; BRAT install/update acceptance and physical mobile testing remain pending. Notion sync is experimental and disabled by default.

            本次通过构建、分发及定向逻辑检查；未重新执行完整性能回归。免费试用许可见 LICENSE。
            Build, distribution and targeted logic checks passed; no full performance regression rerun. See LICENSE for public-trial terms.
