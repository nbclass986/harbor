name: Attach plugin files

on:
  release:
    types: [published]
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin files
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            main.js
            manifest.json
            styles.css
          fail_on_unmatched_files: true
          make_latest: true
