name: Attach plugin files

on:
  release:
    types: [published]
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check distribution and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: node .github/scripts/verify-release.cjs
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: Harbor ${{ github.event.release.tag_name || github.ref_name }}
          files: |
            main.js
            manifest.json
            styles.css
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            ## Harbor ${{ github.event.release.tag_name || github.ref_name }}

            - 新增“扫描库中已有取值”：按当前 YAML 映射补充状态、优先级、人员和标签，自动去重，保留已有选项，不修改笔记。
            - 修复看板列宽拖动，支持更宽的列，并补齐项目详情中的列宽调整。
            - 任务与项目面板固定显示对应类型，移除多余的数据来源入口，避免混入资料。

            Scan existing mapped YAML values into option lists without editing notes,
            resize board columns, and keep task/project boards scoped to their own type.

            **安装 / Install:** BRAT 仓库地址 `nbclass986/harbor`，或将下面三个文件放入 `.obsidian/plugins/harbor/`。
            Use BRAT with `nbclass986/harbor`, or copy the three attached files into `.obsidian/plugins/harbor/`.

            Requires Obsidian 1.9.10+. BRAT install/update acceptance and physical mobile testing remain pending. Notion sync is unavailable in this version.
